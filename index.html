<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Equipment Hours • Single File</title>
<style>
  :root {
    --bg: #0d1421;
    --card: rgba(20,30,50,0.85);
    --border: #2a3a5a;
    --text: #e0e8ff;
    --muted: #a0b0d0;
    --accent: #5a9fff;
    --green: #44cc88;
    --yellow: #ffaa44;
    --red: #ff5555;
    --radius: 10px;
  }
  body { margin: 0; font-family: system-ui, sans-serif; background: var(--bg); color: var(--text); padding: 16px; min-height: 100vh; }
  h1, h2 { margin: 0.6em 0 0.4em; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px 20px; margin-bottom: 24px; box-shadow: 0 6px 24px rgba(0,0,0,0.5); }
  table { width: 100%; border-collapse: collapse; font-size: 0.95rem; }
  th, td { padding: 9px 10px; border: 1px solid rgba(255,255,255,0.07); text-align: center; }
  th { background: rgba(30,45,70,0.9); font-weight: 600; color: #c0d0ff; position: sticky; top: 0; z-index: 2; }
  .sticky-left { position: sticky; left: 0; background: rgba(18,28,48,0.95); z-index: 3; text-align: left; font-weight: bold; min-width: 180px; border-right: 1px solid rgba(255,255,255,0.12); }
  .category-header td { background: rgba(40, 60, 100, 0.9); font-weight: bold; text-align: left; padding-left: 16px; font-size: 1.05rem; color: #aaccff; }
  input[type="number"], input[type="text"], input[type="date"], input[type="file"], select, input[type="password"] {
    width: 100%; max-width: 220px; padding: 8px; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.2); color: white; border-radius: 6px; box-sizing: border-box;
  }
  button { padding: 8px 14px; border-radius: 6px; font-weight: 600; cursor: pointer; border: none; }
  .btn-primary { background: var(--accent); color: white; }
  .btn-danger { background: #ff4444; color: white; }
  .btn-copy { background: #5566aa; color: white; font-size: 0.85rem; padding: 4px 8px; }
  .btn-delete { background: #992222; color: white; font-size: 0.9rem; padding: 4px 8px; margin-left: 8px; }
  .total { font-weight: bold; color: #88ffaa; }
  .flex { display: flex; gap: 16px; flex-wrap: wrap; align-items: center; }
  .sheet { overflow-x: auto; max-height: 520px; border: 1px solid var(--border); border-radius: 8px; margin-bottom: 24px; }
  .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.7); z-index: 1000; align-items: center; justify-content: center; }
  .modal-content { background: #1a2538; padding: 24px; border-radius: 12px; width: 90%; max-width: 420px; border: 1px solid #3a506b; }
  .modal-header { margin-bottom: 16px; font-size: 1.3rem; }
  .modal-buttons { margin-top: 20px; display: flex; gap: 12px; justify-content: flex-end; }
  #loginRoot { display: none; min-height: calc(100vh - 32px); align-items: center; justify-content: center; }
  .login-card { width: 100%; max-width: 420px; background: rgba(20,30,50,0.92); border: 1px solid var(--border); border-radius: 14px; padding: 22px 22px 18px; box-shadow: 0 10px 34px rgba(0,0,0,0.55); }
  .login-title { font-size: 1.5rem; margin: 0 0 6px; color: #cfe0ff; }
  .login-subtitle { margin: 0 0 16px; color: var(--muted); font-size: 0.95rem; line-height: 1.35; }
  .login-row { margin: 12px 0; }
  .login-row label { display: block; margin-bottom: 6px; color: #c0d0ff; font-weight: 600; font-size: 0.95rem; }
  .login-actions { display: flex; gap: 10px; align-items: center; justify-content: flex-end; margin-top: 14px; }
  .login-error { min-height: 20px; margin-top: 10px; color: #ffdd88; }
  .login-links { display: flex; gap: 10px; justify-content: space-between; margin-top: 10px; }
  .link-btn { background: transparent; border: none; color: #aaccff; cursor: pointer; padding: 0; font-weight: 600; }
  .link-btn:hover { text-decoration: underline; }
  .small-note { color: var(--muted); font-size: 0.85rem; margin-top: 6px; line-height: 1.35; }
  #appRoot { display: none; }
</style>
</head>
<body>

<!-- LOGIN -->
<div id="loginRoot" class="flex">
  <div class="login-card">
    <h1 class="login-title">Sign in</h1>
    <p class="login-subtitle">Please log in to access the Equipment Hours Log.</p>
    <div class="login-row"><label for="loginUser">Username</label><input type="text" id="loginUser" placeholder="Enter username" /></div>
    <div class="login-row"><label for="loginPass">Password</label><input type="password" id="loginPass" placeholder="Enter password" /></div>
    <div class="login-row" style="display:flex; align-items:center; gap:10px;">
      <input type="checkbox" id="rememberMe">
      <label for="rememberMe">Remember me</label>
    </div>
    <div class="login-actions">
      <button class="btn-primary" id="btnLogin">Login</button>
      <button class="btn-primary" id="btnGoogleLogin" style="width:100%;">Sign in with Google</button>
    </div>
    <div class="login-links">
      <button class="link-btn" id="btnOpenRegister">Register user</button>
      <button class="link-btn" id="btnOpenReset">Forgot password?</button>
    </div>
    <div id="loginError" class="login-error"></div>
  </div>
</div>

<!-- REGISTER & RESET MODALS -->
<div id="registerModal" class="modal">
  <div class="modal-content">
    <div class="modal-header">Register New User</div>
    <label>Username:</label><input type="text" id="regUser" style="margin:8px 0 12px;" />
    <label>Password:</label><input type="password" id="regPass" style="margin:8px 0 12px;" />
    <div id="regMsg" class="login-error"></div>
    <div class="modal-buttons">
      <button id="btnCancelRegister" style="background:#444;">Cancel</button>
      <button id="btnConfirmRegister" class="btn-primary">Create Account</button>
    </div>
  </div>
</div>

<div id="resetModal" class="modal">
  <div class="modal-content">
    <div class="modal-header">Reset Password</div>
    <p style="color:#a0c0ff;">Password reset link will be sent to your email.</p>
    <label>Username:</label><input type="text" id="resetUser" style="margin:8px 0 12px;" />
    <div id="resetMsg" class="login-error"></div>
    <div class="modal-buttons">
      <button id="btnCancelReset" style="background:#444;">Cancel</button>
      <button id="btnConfirmReset" class="btn-primary">Send Reset Link</button>
    </div>
  </div>
</div>

<!-- APP -->
<div id="appRoot">
  <div class="card">
    <h1>Equipment Hours Log</h1>
    <div class="flex" style="margin:16px 0; gap:12px;">
      <label><strong>Work Date:</strong></label>
      <input type="date" id="workDate" value="2026-06-09" />
      <button class="btn-primary" id="btnLoadDay">Load Day</button>
      <button class="btn-primary" id="btnSaveDay">Save Day</button>
      <button class="btn-primary" id="btnSaveAll">Save (Last Modified)</button>
      <button class="btn-primary" id="btnAddEquipment">+ Add Equipment</button>
      <button class="btn-primary" id="btnExportCSV">Export Monthly CSV</button>
      <label class="btn-primary" style="cursor:pointer;">Import Monthly CSV <input type="file" id="fileImportCSV" accept=".csv" style="display:none;" /></label>
      <button class="btn-danger" id="btnSignOut">Sign out</button>
    </div>
    <div id="toast" style="margin:12px 0; min-height:24px; color:#ffdd88;"></div>

    <div class="sheet">
      <table id="dailyTable">
        <thead>
          <tr>
            <th class="sticky-left">Equipment</th>
            <th>Date</th>
            <th>Hr Service</th>
            <th>Hr Service Date</th>
            <th>Initial</th>
            <th>Final</th>
            <th>Worked</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="dailyBody"></tbody>
      </table>
    </div>
  </div>
</div>

<!-- FIREBASE -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.8.0/firebase-app.js";
  import { getDatabase, ref, get, set } from "https://www.gstatic.com/firebasejs/12.8.0/firebase-database.js";
  import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, createUserWithEmailAndPassword, signOut, setPersistence, browserLocalPersistence, browserSessionPersistence, GoogleAuthProvider, signInWithPopup, sendPasswordResetEmail } from "https://www.gstatic.com/firebasejs/12.8.0/firebase-auth.js";

  const firebaseConfig = {
    apiKey: "AIzaSyBgQbh6pp78iwXpH9qdQk1viEgy9zAmX6A",
    authDomain: "equipment-hours-lmp.firebaseapp.com",
    databaseURL: "https://equipment-hours-lmp-default-rtdb.firebaseio.com",
    projectId: "equipment-hours-lmp",
    storageBucket: "equipment-hours-lmp.firebasestorage.app",
    messagingSenderId: "414868275365",
    appId: "1:414868275365:web:467a98dc301e3585e98d4c"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getDatabase(app);

  window.__fb = { app, auth, db, api: { ref, get, set, onAuthStateChanged, signInWithEmailAndPassword, createUserWithEmailAndPassword, signOut, setPersistence, browserLocalPersistence, browserSessionPersistence, GoogleAuthProvider, signInWithPopup, sendPasswordResetEmail } };
  window.dispatchEvent(new Event("firebase-ready"));
</script>

<script>
// ==================== FULL WORKING CODE ====================
const equipmentGroups = [
  { name: "Generators", items: ["gen1", "gen2", "gen3", "gen4", "gen5"] },
  { name: "Compressors & Lighting", items: ["comp", "tower light"] }
];

let monthData = {};
let currentDate = "2026-06-09";

const CLOUD_STATE_ROOT = "equipHoursState";
let _saveTimer = null;

function fb() { return window.__fb; }
function getUid() { return fb()?.auth?.currentUser?.uid || null; }
function cloudStateRef() {
  const uid = getUid();
  if (!uid) return null;
  return fb().api.ref(fb().db, `${CLOUD_STATE_ROOT}/${uid}`);
}

function saveAppState(silent = false) {
  const r = cloudStateRef();
  if (!r) return;
  const state = { equipmentGroups, monthData, currentDate, updatedAt: Date.now() };
  clearTimeout(_saveTimer);
  _saveTimer = setTimeout(() => fb().api.set(r, state), 250);
}

async function loadAppState() {
  const r = cloudStateRef();
  if (!r) return false;
  try {
    const snap = await fb().api.get(r);
    if (!snap.exists()) return false;
    const state = snap.val();
    if (!state) return false;

    equipmentGroups.length = 0;
    state.equipmentGroups?.forEach(g => {
      if (g && g.name && Array.isArray(g.items)) equipmentGroups.push({ name: g.name, items: [...g.items] });
    });

    monthData = state.monthData || {};
    currentDate = state.currentDate || currentDate;
    $("workDate").value = currentDate;
    return true;
  } catch { return false; }
}

function $(id) { return document.getElementById(id); }
function showToast(msg, color = "#88ffaa") {
  const t = $("toast");
  if (t) {
    t.textContent = msg;
    t.style.color = color;
    t.style.opacity = "1";
    setTimeout(() => t.style.opacity = "0", 3400);
  }
}

function getDayStore(dateStr) {
  const mk = (dateStr || "").slice(0, 7);
  const dn = parseInt((dateStr || "").slice(8, 10), 10);
  if (!monthData[mk]) monthData[mk] = {};
  if (!monthData[mk][dn]) monthData[mk][dn] = {};
  return { store: monthData[mk][dn] };
}

function nextISODate(dateStr) {
  const d = new Date(dateStr);
  d.setDate(d.getDate() + 1);
  return d.toISOString().slice(0, 10);
}

// Render Daily Entry
function renderDailyEntry() {
  const body = $("dailyBody");
  const date = $("workDate").value || currentDate;
  const { store: dayStore } = getDayStore(date);

  let html = "";
  equipmentGroups.forEach(group => {
    html += `<tr class="category-header"><td colspan="8">${group.name}</td></tr>`;
    group.items.forEach(eq => {
      const worked = dayStore[eq] ?? 0;
      const initial = dayStore[eq + "_initial"] ?? 0;
      const final = dayStore[eq + "_final"] ?? Number(worked) + Number(initial);

      html += `
        <tr data-eq="${eq}">
          <td class="sticky-left">${eq}</td>
          <td>${date}</td>
          <td><input type="number" step="0.1" class="hr-service"></td>
          <td><input type="date" class="hr-service-date"></td>
          <td><input type="number" step="0.1" value="${initial}" class="initial"></td>
          <td><input type="number" step="0.1" value="${final}" class="final"></td>
          <td class="worked">${Number(worked).toFixed(1)}</td>
          <td>
            <button class="btn-copy" data-action="copy-final">Copy Final → Initial</button>
            <button class="btn-delete" data-action="delete-eq">×</button>
          </td>
        </tr>`;
    });
  });
  body.innerHTML = html;
}

// FIXED Save (Last Modified) Button
$("btnSaveAll").onclick = () => {
  const dateStr = $("workDate").value || currentDate;
  const { store: todayStore } = getDayStore(dateStr);
  const nextDateStr = nextISODate(dateStr);
  const { store: nextStore } = getDayStore(nextDateStr);

  const rows = $("dailyBody").querySelectorAll("tr[data-eq]");

  rows.forEach(row => {
    const eq = row.dataset.eq;
    const finalVal = Number(row.querySelector(".final").value) || 0;

    todayStore[eq] = Number(row.querySelector(".worked").textContent) || 0;

    // Copy Final to Next Day Initial if empty
    if (finalVal > 0 && (!nextStore[eq + "_initial"] || nextStore[eq + "_initial"] === 0)) {
      nextStore[eq + "_initial"] = finalVal;
    }
  });

  saveAppState(true);
  showToast("Saved (Last Modified) + copied Final → next Initial (if empty)", "#44cc88");

  renderDailyEntry();
};

// Initial Render
renderDailyEntry();

// Auth (basic)
window.addEventListener("firebase-ready", () => {
  // Auth logic can be added later if needed
});
</script>
</body>
</html>
